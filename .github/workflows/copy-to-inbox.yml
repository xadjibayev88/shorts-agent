name: Bir martalik - kalitlarni inbox-agent ga ko'chirish

# Faqat shu branchga push qilinganda ishlaydi. Ish tugagach fayl olib tashlanadi.
on:
  push:
    branches: [ccr-fc013c7c-skmvcg]
    paths: [.github/workflows/copy-to-inbox.yml]

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kalitlarni ko'chirish (qiymatlar logga chiqmaydi)
        env:
          GH_TOKEN: ${{ secrets.INBOX_COPY_PAT }}
          SRC_IG_ACCESS_TOKEN_APEX: ${{ secrets.IG_ACCESS_TOKEN_APEX }}
          SRC_YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          SRC_YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          SRC_YT_CLIENT_ID_APEX: ${{ secrets.YT_CLIENT_ID_APEX }}
          SRC_YT_CLIENT_SECRET_APEX: ${{ secrets.YT_CLIENT_SECRET_APEX }}
          SRC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SRC_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SRC_CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SRC_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SRC_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SRC_NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SRC_SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: |
          set -u
          [ -n "$GH_TOKEN" ] || { echo "INBOX_COPY_PAT secret yo'q"; exit 1; }
          existing=$(gh secret list --repo xadjibayev88/inbox-agent --json name -q '.[].name')
          copy() {
            local src=$1 dst=$2 var="SRC_$1"
            local val="${!var:-}"
            if [ -z "$val" ]; then echo "- $src: bu repoda yo'q, o'tkazildi"; return; fi
            if echo "$existing" | grep -qx "$dst"; then echo "- $dst: inbox-agent da allaqachon bor, tegilmadi"; return; fi
            printf '%s' "$val" | gh secret set "$dst" --repo xadjibayev88/inbox-agent && echo "+ $src -> $dst ko'chirildi"
          }
          copy IG_ACCESS_TOKEN_APEX IG_TOKEN_APEXWEALTHS
          copy YT_CLIENT_ID YT_CLIENT_ID
          copy YT_CLIENT_SECRET YT_CLIENT_SECRET
          copy YT_CLIENT_ID_APEX YT_CLIENT_ID_APEX
          copy YT_CLIENT_SECRET_APEX YT_CLIENT_SECRET_APEX
          copy GEMINI_API_KEY GEMINI_API_KEY
          copy GROQ_API_KEY GROQ_API_KEY
          copy CEREBRAS_API_KEY CEREBRAS_API_KEY
          copy MISTRAL_API_KEY MISTRAL_API_KEY
          copy OPENROUTER_API_KEY OPENROUTER_API_KEY
          copy NVIDIA_API_KEY NVIDIA_API_KEY
          copy SAMBANOVA_API_KEY SAMBANOVA_API_KEY
