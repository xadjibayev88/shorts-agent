name: Kanal statistikasi (kunlik)

on:
  schedule:
    - cron: "37 16 * * *"   # 21:37 Toshkent, kechki ofis tekshiruvidan oldin
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-agent
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: YouTube statistikasi
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/yt_stats.py
      - name: Saqlash
        run: |
          git config user.name "shorts-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/stats
          git diff --cached --quiet || git commit -m "stats: $(date -u +%F)"
          git pull --rebase -q || true
          git push || echo "push qilinmadi"
