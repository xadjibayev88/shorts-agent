name: YouTube Shorts Agent

on:
  schedule:
    # Vaqtlar UTC'da. Toshkent = UTC+5
    - cron: "7 3 * * *"     # 08:07 Toshkent
    - cron: "23 7 * * *"    # 12:23
    - cron: "11 12 * * *"   # 17:11
    - cron: "17 15 * * *"   # 20:17
    - cron: "13 17 * * *"   # 22:13
  workflow_dispatch:
    inputs:
      count:
        description: "Nechta video"
        default: "1"
      upload:
        description: "YouTube'ga joylansinmi? (true/false)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: shorts-agent
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg va shriftlar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/Montserrat-ExtraBold.ttf ]; then
            curl -fsSL -o assets/fonts/Montserrat-ExtraBold.ttf \
              https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-ExtraBold.ttf \
              || echo "Montserrat yuklanmadi — DejaVu ishlatiladi"
          fi

      - name: Python kutubxonalari
        run: pip install -r requirements.txt

      - name: Shorts yaratish va joylash
        env:
          GEMINI_API_KEY: ${{ AQ.Ab8RN6J2zy0_IL3BgTTGNzD1FfrQ2Jiif7Xc_9nbRmG58fzEcQ }}
          PIXABAY_API_KEY: ${{ 58221434-f96ee8edcbf5ebdabd925cbcd}}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          UPLOAD="${{ github.event.inputs.upload || 'true' }}"
          FLAGS=""
          [ "$UPLOAD" = "false" ] && FLAGS="--no-upload"
          python -m agent.main --count "$COUNT" $FLAGS

      - name: Tarixni saqlash (takrorlanmaslik uchun)
        if: always()
        run: |
          git config user.name "shorts-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "history: $(date -u +%F_%H%M)"
          git pull --rebase -q || true
          git push || echo "push qilinmadi"

      - name: Videoni artifact sifatida saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: output/**/*
          retention-days: 5
          if-no-files-found: ignore
