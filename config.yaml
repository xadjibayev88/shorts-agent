# ===============================================================
#  YouTube Shorts Agent — sozlamalar
#  Kalitlar (API key, token) bu yerga YOZILMAYDI — ular GitHub Secrets'da.
# ===============================================================

channel:
  language: uz                 # video tili
  niche: "Bilarmidingiz — qiziqarli faktlar"   # kanal yo'nalishi
  # Har safar shu mavzulardan biri navbat bilan tanlanadi
  genres:
    # Analitika: okean va hayvonlar eng ko'p ko'rilgan; mahalliy mavzu raqobatchilarda eng kuchli signal
    - "okean va dengiz tubidagi sirli fakt"
    - "hayvonlar olamidagi g'aroyib fakt"
    - "O'zbekiston va Markaziy Osiyo haqida kam odam biladigan haqiqiy fakt (tabiat, shaharlar, rekordlar)"
    - "inson tanasi va miyasi haqida kam odam biladigan fakt"
    - "chuqur dengiz jonzotlari va ularning g'aroyib xususiyatlari"
    - "hayvonlar rekordlari: eng tez, eng katta, eng uzoq yashaydigan"
    - "O'zbekiston tarixi va buyuk olimlari (Ibn Sino, Al-Xorazmiy, Ulug'bek, Beruniy) haqida aniq fakt"
    - "koinot, sayyoralar va yulduzlar haqida hayratlanarli fakt"
    - "tabiat hodisalari va ob-havo haqida fakt"
    - "tarixdagi kutilmagan, ishonish qiyin fakt"

story:
  min_words: 22
  max_words: 35
  scenes_min: 3
  scenes_max: 5
  history_avoid_last: 120      # oxirgi N ta sarlavhani takrorlamaydi
  opener: ""                   # "Bilarmidingiz," har videoda shablon bo'lib qolgan edi

fact_check:
  web_search: true      # Gemini + Google Search bilan internetdan tekshirish (eskirgan faktlarni ham ushlaydi)
  required: true        # hech bir tekshiruvchi ishlamasa, video joylanmaydi

llm:
  # Matn yozuvchi modellar shu tartibda sinab ko'riladi. Kaliti (GitHub Secret) yo'q provayder o'tkazib yuboriladi.
  # Har provayderning eng yaxshi modeli avtomatik tanlanadi, shuning uchun model nomlarini yozish shart emas.
  # Yozgan model faktni boshqa provayderdagi model tekshiradi (fakt-tekshiruv).
  order: [gemini, omniroute, groq, mistral, kilo, ovh]

gemini:
  # Faqat Gemini modellar ro'yxatini olib bo'lmasa ishlatiladi
  models:
    - "gemini-3.8-flash"
    - "gemini-3.7-flash"
  temperature: 0.9

tts:
  # Egasi 2026-11-15: multfilm-studio dagi ovoz (Edge Sardor, to'g'ri o'/g' talaffuzi). "edge" ni olib tashlasangiz eski zanjir qaytadi.
  engine: edge
  # Zaxira: OmniVoice (bepul, GitHub'da CPU'da). Egasi tanlagan "B" erkak ovozidan klon. Notijorat litsenziya.
  omnivoice:
    enabled: true
    ref: assets/voice/omni_ref.wav
    ref_text: assets/voice/omni_ref.txt
    steps: 16
    seed: 7
  # Asosiy: o'zimiz yaratgan "Bilarmidingiz Narrator" (eleven_v3, bepul API). Ishlamasa Bella, keyin Edge.
  elevenlabs_voice: Curb9hizxeRZfhwGj6iT
  elevenlabs_model: eleven_v3
  elevenlabs_backup_voice: hpp4J3VqNfWAUOO0d1Us
  elevenlabs_backup_model: eleven_multilingual_v2
  # O'zbek ovozlari: uz-UZ-SardorNeural (erkak), uz-UZ-MadinaNeural (ayol)
  voice: "uz-UZ-SardorNeural"
  rate: "+10%"
  pitch: "+0Hz"

video:
  width: 1080
  height: 1920
  fps: 30
  max_duration: 18             # soniya: raqobatchilarning 7-14 s faktlari eng ko'p ko'riladi
  crf: 20
  preset: "medium"
  progress_bar: false          # loop: video tugaganini bildirmasin
  progress_color: "0xFFFFFF"

subtitles:
  font_file: "assets/fonts/Montserrat-ExtraBold.ttf"   # bo'lmasa DejaVu ishlatiladi
  font_size: 92
  words_per_line: 3
  highlight_color: "&H00FFFFFF"   # ASS formatda (BGR): oq (brend qoidasi: subtitrlar to'liq oq)
  base_color: "&H00FFFFFF"
  outline: 7
  position_y: 1150                # subtitr markazi (piksel)
  hook_seconds: 2.6               # tepada "hook" matni necha soniya turadi

music:
  enabled: true
  folder: "assets/music"          # .mp3 fayllarni shu yerga tashlang
  volume: 0.16                    # ovoz ostida (ducking bilan)

pexels:
  per_page: 15
  min_height: 1280

youtube:
  privacy: "public"               # public | unlisted | private
  category_id: "27"               # 27 = Education
  made_for_kids: false
  synthetic_media: true           # AI kontent belgisi (YouTube talabi)
  extra_tags: [shorts, bilarmidingiz, qiziqarli faktlar, bilasizmi, faktlar, қизиқарли фактлар,
  биласизми, билармидингиз, ajoyib faktlar, hayratlanarli faktlar, dunyo sirlari,
  o'zbekcha faktlar, uzbek, интересные факты, а вы знали]
  hashtags: ['#shorts', '#qiziqarlifaktlar', '#bilarmidingiz']
  description_footer: "Bilarmidingiz: har kuni qisqa va tekshirilgan qiziqarli faktlar. Obuna bo'ling va\
  \ do'stingizga yuboring.
Matn va ovoz sun'iy intellekt yordamida tayyorlangan,\
  \ faktlar alohida tekshirilgan. Kadrlar: Pixabay."
