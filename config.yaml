# ===============================================================
#  YouTube Shorts Agent — sozlamalar
#  Kalitlar (API key, token) bu yerga YOZILMAYDI — ular GitHub Secrets'da.
# ===============================================================

channel:
  language: uz                 # video tili
  niche: "Bilarmidingiz — qiziqarli faktlar"   # kanal yo'nalishi
  # Har safar shu mavzulardan biri navbat bilan tanlanadi
  genres:
    - "koinot, sayyoralar va yulduzlar haqida hayratlanarli fakt"
    - "hayvonlar olamidagi g'aroyib fakt"
    - "inson tanasi va miyasi haqida kam odam biladigan fakt"
    - "tarixdagi kutilmagan, ishonish qiyin fakt"
    - "okean va dengiz tubidagi sirli fakt"
    - "texnologiya va ixtirolar haqida qiziq fakt"
    - "tabiat hodisalari va ob-havo haqida fakt"
    - "dunyo davlatlari va shaharlari haqida g'alati fakt"
    - "ovqat va ichimliklar haqida bilmagan faktingiz"
    - "qadimiy sivilizatsiyalar va ularning sirlari"

story:
  min_words: 45
  max_words: 75
  scenes_min: 5
  scenes_max: 8
  history_avoid_last: 120      # oxirgi N ta sarlavhani takrorlamaydi

llm:
  # Matn yozuvchi modellar shu tartibda sinab ko'riladi. Kaliti (GitHub Secret) yo'q provayder o'tkazib yuboriladi.
  # Har provayderning eng yaxshi modeli avtomatik tanlanadi, shuning uchun model nomlarini yozish shart emas.
  # Yozgan model faktni boshqa provayderdagi model tekshiradi (fakt-tekshiruv).
  order: [gemini, omniroute, groq, mistral, kilo, ovh]

gemini:
  # Faqat Gemini modellar ro'yxatini olib bo'lmasa ishlatiladi
  models:
    - "gemini-3.8-flash"
    - "gemini-3.7-flash"
  temperature: 0.9

tts:
  # O'zbek ovozlari: uz-UZ-SardorNeural (erkak), uz-UZ-MadinaNeural (ayol)
  voice: "uz-UZ-SardorNeural"
  rate: "+10%"
  pitch: "+0Hz"

video:
  width: 1080
  height: 1920
  fps: 30
  max_duration: 40             # soniya: qisqa Shorts oxirigacha ko'riladi
  crf: 20
  preset: "medium"
  progress_bar: true
  progress_color: "0xFFFFFF"

subtitles:
  font_file: "assets/fonts/Montserrat-ExtraBold.ttf"   # bo'lmasa DejaVu ishlatiladi
  font_size: 92
  words_per_line: 3
  highlight_color: "&H00FFFFFF"   # ASS formatda (BGR): oq (brend qoidasi: subtitrlar to'liq oq)
  base_color: "&H00FFFFFF"
  outline: 7
  position_y: 1150                # subtitr markazi (piksel)
  hook_seconds: 2.6               # tepada "hook" matni necha soniya turadi

music:
  enabled: true
  folder: "assets/music"          # .mp3 fayllarni shu yerga tashlang
  volume: 0.16                    # ovoz ostida (ducking bilan)

pexels:
  per_page: 15
  min_height: 1280

youtube:
  privacy: "public"               # public | unlisted | private
  category_id: "27"               # 27 = Education
  made_for_kids: false
  synthetic_media: true           # AI kontent belgisi (YouTube talabi)
  extra_tags: ["shorts", "bilarmidingiz", "qiziqarli faktlar", "faktlar", "bilasizmi", "uzbek"]
  hashtags: ["#shorts", "#bilarmidingiz", "#faktlar"]
